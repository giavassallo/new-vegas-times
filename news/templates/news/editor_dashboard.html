<h1>Editor Dashboard</h1>

<h2>Articles Awaiting Review</h2>

{% for article in articles %}
    <div>
        <h3>{{ article.title }}</h3>
        <p>{{ article.content|truncatewords:30 }}</p>

        <a href="/approve/{{ article.id }}/">Approve</a>
    </div>
{% empty %}
    <p>No articles to review.</p>
{% endfor %}
