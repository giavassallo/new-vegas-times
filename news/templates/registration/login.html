{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | New Vegas Times</title>

    <link rel="stylesheet" href="{% static 'news/css/style.css' %}">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>

<body class="fallout-bg">

    <div class="login-container">

        <h1 class="site-title">New Vegas Times</h1>

        <h2 class="login-subtitle">Secure Terminal Login</h2>

        <form method="post" class="login-form">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="vault-button">
                Access Terminal
            </button>
        </form>

    </div>

</body>
</html>
